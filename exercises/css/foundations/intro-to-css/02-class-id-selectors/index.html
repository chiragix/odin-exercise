<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Class ID Selectors</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<p class="john">John: Hello, how are you doing cloie?</p>
	<div id="cloie-a">I'm good. What about you?</div>
	<p class="john big">I'm headed to class. Should we go together?</p>
	<div id="cloie-b">Yeah sure!</div>
	<p class="john">Okay.</p>
	
</body>
</html>
